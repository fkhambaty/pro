# Okavo local Supabase stack.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
#   supabase start
#   supabase db reset   # applies migrations + seed.sql
#
# Point apps/catalog/.env.local at http://127.0.0.1:54321 and the local anon key
# printed by `supabase status`.

project_id = "okavo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Match the hosted project major version when possible.
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.identity-documents]
public = false
file_size_limit = "20MiB"

[storage.buckets.interview-recordings]
public = false
file_size_limit = "200MiB"

[storage.buckets.deliverables]
public = false
file_size_limit = "50MiB"

[auth]
enabled = true
# Local Vite app (see package.json `dev` script).
site_url = "http://127.0.0.1:5180"
additional_redirect_urls = [
  "http://127.0.0.1:5180/**",
  "http://localhost:5180/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so seed-accounts / smoke can sign in immediately.
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
